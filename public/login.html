<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c4572e">
  <title>Hearth</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
  <style>
    .login { max-width: 340px; margin: 18vh auto 0; padding: 0 16px; text-align: center; }
    .login h1 { margin-bottom: 4px; }
    .login form { display: grid; gap: 10px; margin-top: 20px; }
    .login input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
    .login button { font: inherit; padding: 10px; border-radius: 10px; border: 0; background: var(--clay); color: #fff; cursor: pointer; }
    .login .pw { position: relative; display: grid; }
    .login .pw input { padding-right: 64px; }
    .login .peek { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); padding: 4px 10px; font-size: 13px; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; }
    .login .peek:hover { color: var(--ink); }
    .login .note { min-height: 1.4em; color: var(--clay); font-size: 14px; }
    .login-ember { max-width: 480px; margin: 6vh auto 40px; padding: 0 16px; }
  </style>
</head>
<body>
  <main class="login">
    <h1>Hearth</h1>
    <p class="muted">Say the word and the fire is yours.</p>
    <!-- A fixed username so password managers save and fill this login. -->
    <form method="post" action="/login">
      <input type="text" name="username" value="hearth" autocomplete="username" hidden>
      <div class="pw">
        <input type="password" name="password" id="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required autofocus>
        <button type="button" class="peek" id="peek" aria-pressed="false" aria-controls="password">Show</button>
      </div>
      <button type="submit">Come in</button>
      <p class="note" id="note"></p>
    </form>
  </main>
  <div class="login-ember"></div>
  <script>
    const pw = document.getElementById("password"), peek = document.getElementById("peek");
    peek.onclick = () => {
      const show = pw.type === "password";
      pw.type = show ? "text" : "password";
      peek.textContent = show ? "Hide" : "Show";
      peek.setAttribute("aria-pressed", String(show));
      pw.focus();
    };
    // Hide it again on submit, so the browser saves it as a password and nothing lingers on screen.
    document.querySelector("form").addEventListener("submit", () => (pw.type = "password"));
    const q = location.search;
    document.getElementById("note").textContent =
      q.includes("wrong") ? "Not that one." : q.includes("wait") ? "Too many tries. Wait a minute." : "";
  </script>
  <script src="/ember.js"></script>
  <script>window.emberGame?.(document.querySelector(".login-ember"));</script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});</script>
</body>
</html>
