<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c4572e">
  <title>Hearth</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="layout">
    <main id="main">
      <header class="top">
        <div class="brand">
          <h1>Hearth</h1>
          <p class="today" id="today"></p>
          <div class="rhythm" id="rhythm"></div>
        </div>
        <div class="tools" id="actions"></div>
        <button class="power" id="shutdown" title="Stop the Hearth server" aria-label="Stop the Hearth server">⏻ Stop server</button>
      </header>
      <div id="notices"></div>

      <section class="garden-wrap" aria-label="Kin map">
        <h2 class="map-title">Kin map</h2>
        <div class="garden" id="garden"><p class="muted">Lighting the fire…</p></div>
        <div class="tip" id="tip" role="tooltip" hidden></div>
        <div class="legend" id="legend"></div>
      </section>

      <div id="sections"></div>
    </main>

    <aside class="chat" id="chat" aria-label="Conversation">
      <button class="rail" id="rail" title="Open the conversation (\)" aria-label="Open the conversation">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="var(--amber)"/><path d="M12 12c1 2 3 3 3 5a3 3 0 0 1-6 0c0-1 1-2 1-3 1 1 1 1 2 1 0-1 0-2 0-3z" fill="var(--clay)"/></svg>
        <span class="rail-label">Conversation</span>
        <span class="rail-dot" id="railDot" hidden></span>
      </button>
      <div class="chat-head">
        <strong>Conversation</strong>
        <span class="chat-status muted" id="chatStatus"></span>
        <div class="chat-tools">
          <button class="ghost" id="newChat" title="Start a new conversation">New</button>
          <button class="ghost only-desktop" id="collapseChat" title="Fold to the side (\)" aria-label="Fold the conversation to the side">⇥</button>
          <button class="ghost only-mobile" id="closeChat" aria-label="Close">✕</button>
        </div>
      </div>
      <div class="chat-log" id="log">
        <p class="muted hint">Pick an action above, or a person's tend / repair / write, or just write.</p>
      </div>
      <form class="chat-input" id="form">
        <textarea id="input" rows="2" placeholder="Write to Claude… (Enter to send, Shift+Enter for a new line)"></textarea>
        <div class="chat-buttons">
          <button type="button" class="ghost" id="stop" hidden>Stop</button>
          <button type="submit" id="send">Send</button>
        </div>
      </form>
    </aside>
  </div>

  <dialog class="sheet" id="sheet" aria-label="Person"></dialog>
  <button class="chat-fab only-mobile" id="openChat">Conversation</button>
  <script src="/app.js"></script>
</body>
</html>
